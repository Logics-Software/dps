<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebView Debug</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        .debug-info {
            background: #f4f4f4;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007bff;
        }
        .success { border-left-color: #28a745; background: #d4edda; }
        .warning { border-left-color: #ffc107; background: #fff3cd; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>WebView Biometric Debug</h1>
    
    <div id="userAgent" class="debug-info">
        <strong>User Agent:</strong><br>
        <span id="userAgentText"></span>
    </div>
    
    <div id="webviewDetection" class="debug-info">
        <strong>WebView Detection:</strong><br>
        <span id="webviewText"></span>
    </div>
    
    <div id="biometricSupport" class="debug-info">
        <strong>Biometric Support:</strong><br>
        <span id="biometricText"></span>
    </div>
    
    <div id="nativeInterface" class="debug-info">
        <strong>Native Interface:</strong><br>
        <span id="nativeText"></span>
    </div>
    
    <div id="webauthnSupport" class="debug-info">
        <strong>WebAuthn Support:</strong><br>
        <span id="webauthnText"></span>
    </div>
    
    <div style="margin-top: 20px;">
        <button onclick="testBiometricRegistration()">Test Biometric Registration</button>
        <button onclick="testBiometricAuth()">Test Biometric Auth</button>
        <button onclick="refreshInfo()">Refresh Info</button>
    </div>
    
    <div id="testResults" class="debug-info" style="display: none;">
        <strong>Test Results:</strong><br>
        <span id="testResultsText"></span>
    </div>

    <script src="assets/js/webauthn.js"></script>
    <script>
        function updateDebugInfo() {
            // User Agent
            document.getElementById('userAgentText').textContent = navigator.userAgent;
            
            // WebView Detection
            const isWebView = WebAuthnHelper.isWebView();
            const isAndroidWebView = WebAuthnHelper.isAndroidWebView();
            document.getElementById('webviewText').innerHTML = `
                Is WebView: ${isWebView}<br>
                Is Android WebView: ${isAndroidWebView}
            `;
            document.getElementById('webviewDetection').className = 
                'debug-info ' + (isWebView ? 'warning' : 'success');
            
            // Native Interface
            const hasAndroid = typeof Android !== 'undefined';
            const hasWebkit = typeof webkit !== 'undefined';
            const hasAndroidBiometric = hasAndroid && Android.authenticateBiometric;
            const hasWebkitBiometric = hasWebkit && webkit.messageHandlers && webkit.messageHandlers.biometric;
            
            document.getElementById('nativeText').innerHTML = `
                Android object: ${hasAndroid}<br>
                Android.authenticateBiometric: ${hasAndroidBiometric}<br>
                Webkit object: ${hasWebkit}<br>
                Webkit biometric handler: ${hasWebkitBiometric}
            `;
            document.getElementById('nativeInterface').className = 
                'debug-info ' + (hasAndroidBiometric || hasWebkitBiometric ? 'success' : 'error');
            
            // Biometric Support
            const isNativeAvailable = WebAuthnHelper.isNativeBiometricAvailable();
            const isSupported = WebAuthnHelper.isSupported();
            document.getElementById('biometricText').innerHTML = `
                Native Biometric Available: ${isNativeAvailable}<br>
                WebAuthn Helper Supported: ${isSupported}
            `;
            document.getElementById('biometricSupport').className = 
                'debug-info ' + (isSupported ? 'success' : 'error');
            
            // WebAuthn Support
            const hasPublicKeyCredential = typeof window.PublicKeyCredential !== 'undefined';
            document.getElementById('webauthnText').innerHTML = `
                PublicKeyCredential: ${hasPublicKeyCredential}
            `;
            document.getElementById('webauthnSupport').className = 
                'debug-info ' + (hasPublicKeyCredential ? 'success' : 'warning');
        }
        
        function showTestResult(message, isSuccess = true) {
            document.getElementById('testResultsText').textContent = message;
            document.getElementById('testResults').className = 
                'debug-info ' + (isSuccess ? 'success' : 'error');
            document.getElementById('testResults').style.display = 'block';
        }
        
        async function testBiometricRegistration() {
            try {
                showTestResult('Testing biometric registration...', true);
                const result = await WebAuthnHelper.registerBiometric();
                showTestResult('Registration successful: ' + JSON.stringify(result), true);
            } catch (error) {
                showTestResult('Registration failed: ' + error.message, false);
            }
        }
        
        async function testBiometricAuth() {
            try {
                showTestResult('Testing biometric authentication...', true);
                const result = await WebAuthnHelper.authenticateBiometric('testuser');
                showTestResult('Authentication successful: ' + JSON.stringify(result), true);
            } catch (error) {
                showTestResult('Authentication failed: ' + error.message, false);
            }
        }
        
        function refreshInfo() {
            updateDebugInfo();
            document.getElementById('testResults').style.display = 'none';
        }
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', updateDebugInfo);
    </script>
</body>
</html>
